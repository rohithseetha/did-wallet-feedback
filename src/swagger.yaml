      tags:
        - Persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tokenId
                - newScore
              properties:
                tokenId:
                  type: string
                  description: Relationship token ID
                newScore:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: New reputation score (0-100)
      responses:
        '200':
          description: Reputation updated successfully
        '400':
          description: Invalid request
        '500':
          description: Server error

