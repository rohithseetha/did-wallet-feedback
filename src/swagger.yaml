            type: string
          description: Relationship token ID
      responses:
        '200':
          description: Relationship retrieved successfully
        '400':
          description: Invalid request
        '500':
          description: Server error

  /persona/relationship:
    post:
      summary: Create a relationship between two users (requires OPERATOR_ROLE)
      tags:
        - Persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user1
                - user2
                - totalSupply
                - relationshipType
              properties:
                user1:
                  type: string
                  description: First user address
                user2:
                  type: string
                  description: Second user address
                totalSupply:
                  type: string
                  description: Total supply for the relationship (must be even for 50/50 split)
                relationshipType:
                  type: integer
                  enum: [0, 1, 2]
                  description: Relationship type (0=Follow, 1=Mutual, 2=Partnership)
      responses:
        '201':
          description: Relationship created successfully
        '400':
          description: Invalid request
        '500':
          description: Server error

  /persona/update-reputation:
    post:
