                  description: Role hash (e.g., OPERATOR_ROLE, VERIFIER_ROLE)
                account:
                  type: string
                  description: Address to revoke role from
      responses:
        '200':
          description: Role revoked successfully
        '400':
          description: Invalid request
        '403':
          description: Access denied - missing ADMIN_ROLE
        '500':
          description: Server error