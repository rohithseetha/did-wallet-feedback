openapi: 3.0.0
info:
  title: DID Wallet API
  version: 2.0.0
  description: API documentation for DID Wallet backend services with Token Economy, Staking, and Persona features

servers:
  - url: http://localhost:3000/api
    description: Local development server

paths:
  /did/generate:
    post:
      summary: Generate a new DID
      tags:
        - DID
      responses:
        '201':
          description: DID generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DIDResponse'
        '500':
          description: Server error

  /did/balance/{address}:
    get:
      summary: Get ETH balance for an address
      tags:
        - DID
      parameters:
        - in: path
          name: address
          required: true
          schema:
            type: string
          description: Ethereum address to check balance for
      responses:
        '200':
          description: Balance retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '400':
          description: Invalid address
        '500':
          description: Server error

  /did/sign:
    post:
      summary: Sign a message or JSON payload using DID
      tags:
        - DID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SignMessageRequest'
                - $ref: '#/components/schemas/SignFeedbackRequest'
            examples:
              simpleMessage:
                summary: Simple message signing
                value:
                  message: "Hello World"
                  privateKey: "89896e87e9d9f119531903767412b1336e663dd0bc41e9238af8589a396c8780"
              feedbackPayload:
                summary: Feedback payload signing
                value:
                  feedback:
                    message: "Great service!"
                    submitterDid: "did:ethr:0x1234567890123456789012345678901234567890"
                    receiverDid: "did:ethr:0x9876543210987654321098765432109876543210"
                    rating: 5
                  privateKey: "89896e87e9d9f119531903767412b1336e663dd0bc41e9238af8589a396c8780"
      responses:
        '200':
          description: Message signed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResponse'
        '400':
          description: Invalid request
        '500':
          description: Server error

  /did/verify:
    post:
      summary: Verify a signed message
      tags:
        - DID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
            example:
              message: "Hello World"
              signature: "0x1234567890..."
              address: "0x1234567890123456789012345678901234567890"
      responses:
        '200':
          description: Signature verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          description: Invalid request
        '500':
          description: Server error

  /feedback/submit:
    post:
      summary: Submit feedback with DID authentication
      tags:
        - Feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
                - submitterDid
                - receiverDid
                - rating
                - signature
              properties:
                message:
                  type: string
                  description: Feedback message
                submitterDid:
                  type: string
                  description: DID of the submitter
                receiverDid:
                  type: string
                  description: DID of the receiver
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Rating score (1-5)
                signature:
                  type: string
                  description: Signed payload for authentication
            example:
              message: "Great service!"
              submitterDid: "did:ethr:0x1234567890123456789012345678901234567890"
              receiverDid: "did:ethr:0x9876543210987654321098765432109876543210"
              rating: 5
              signature: "0x1234567890..."
      responses:
        '201':
          description: Feedback submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      transactionHash:
                        type: string
                      blockNumber:
                        type: integer
                      submitterDid:
                        type: string
                      receiverDid:
                        type: string
                      message:
                        type: string
                      rating:
                        type: integer
                      submitter:
                        type: string
        '400':
          description: Invalid request
        '500':
          description: Server error

  /feedback/list:
    get:
      summary: Get all feedback submissions
      tags:
        - Feedback
      responses:
        '200':
          description: List of feedback submissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        submitter:
                          type: string
                        submitterDid:
                          type: string
                        receiverDid:
                          type: string
                        message:
                          type: string
                        rating:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
        '500':
          description: Server error

  /feedback/reputation/{did}:
    get:
      summary: Get reputation for a DID
      tags:
        - DID
      parameters:
        - in: path
          name: did
          required: true
          schema:
            type: string
          description: DID to get reputation for
          example: "did:ethr:0x1234567890123456789012345678901234567890"
      responses:
        '200':
          description: Reputation retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      did:
                        type: string
                      totalRating:
                        type: string
                      feedbackCount:
                        type: string
                      averageRating:
                        type: string
        '400':
          description: Invalid request
        '500':
          description: Server error

components:
  schemas:
    DIDResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            did:
              type: string
            address:
              type: string
            privateKey:
              type: string

    BalanceResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            address:
              type: string
              description: Ethereum address
            balance:
              type: string
              description: Balance in ETH
            balanceWei:
              type: string
              description: Balance in Wei

    SignMessageRequest:
      type: object
      required:
        - message
        - privateKey
      properties:
        message:
          type: string
          description: Simple message to sign
        privateKey:
          type: string
          description: Ethereum private key

    SignFeedbackRequest:
      type: object
      required:
        - feedback
        - privateKey
      properties:
        feedback:
          type: object
          required:
            - message
            - submitterDid
            - receiverDid
            - rating
          properties:
            message:
              type: string
              description: Feedback message
            submitterDid:
              type: string
              description: DID of the submitter
            receiverDid:
              type: string
              description: DID of the receiver
            rating:
              type: integer
              minimum: 1
              maximum: 5
              description: Rating score (1-5)
        privateKey:
          type: string
          description: Ethereum private key

    SignResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            signedMessage:
              type: string
            did:
              type: string

    VerifyRequest:
      type: object
      required:
        - message
        - signature
        - address
      properties:
        message:
          type: string
          description: Original message that was signed
        signature:
          type: string
          description: Message signature
        address:
          type: string
          description: Ethereum address of the signer

    VerifyResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            isValid:
              type: boolean
            recoveredAddress:
              type: string

  /token/balance/{address}:
    get:
      summary: Get token balance for an address
      tags:
        - Token
      parameters:
        - in: path
          name: address
          required: true
          schema:
            type: string
          description: Ethereum address to check balance for
        - in: query
          name: tokenId
          schema:
            type: integer
            default: 1
          description: Token ID to check (optional, defaults to 1 for CENT token)
      responses:
        '200':
          description: Balance retrieved successfully
        '400':
          description: Invalid address
        '500':
          description: Server error

  /token/info:
    get:
      summary: Get token contract information
      tags:
        - Token
      responses:
        '200':
          description: Token info retrieved successfully

  /token/approve-all:
    post:
      summary: Approve or revoke approval for an operator (CRITICAL for staking)
      tags:
        - Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - operator
                - approved
              properties:
                operator:
                  type: string
                  description: Address of the operator to approve/revoke
                  example: "0xbe12f7C25D130251d986772C12e9fF2eA71045dD"
                approved:
                  type: boolean
                  description: true to approve, false to revoke
      responses:
        '200':
          description: Approval updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      transactionHash:
                        type: string
                      blockNumber:
                        type: integer
        '400':
          description: Invalid request
        '500':
          description: Server error

  /token/has-role/{role}/{address}:
    get:
      summary: Check if an address has a specific role
      tags:
        - Token
      parameters:
        - in: path
          name: role
          required: true
          schema:
            type: string
          description: Role hash (e.g., MINTER_ROLE, ADMIN_ROLE)
        - in: path
          name: address
          required: true
          schema:
            type: string
          description: Address to check
      responses:
        '200':
          description: Role check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      hasRole:
                        type: boolean
        '400':
          description: Invalid request
        '500':
          description: Server error

  /token/mint:
    post:
      summary: Mint tokens (requires MINTER_ROLE)
      tags:
        - Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
                - amount
              properties:
                to:
                  type: string
                  description: Address to mint tokens to
                tokenId:
                  type: integer
                  default: 1
                  description: Token ID to mint (optional, defaults to 1 for CENT token)
                amount:
                  type: string
                  description: Amount to mint (in tokens, will be converted to wei)
      responses:
        '201':
          description: Tokens minted successfully
        '400':
          description: Invalid request
        '500':
          description: Server error

  /token/transfer:
    post:
      summary: Transfer tokens
      tags:
        - Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
                - tokenId
                - amount
              properties:
                to:
                  type: string
                  description: Address to transfer tokens to
                tokenId:
                  type: integer
                  description: Token ID to transfer
                amount:
                  type: string
                  description: Amount to transfer (in tokens)
      responses:
        '200':
          description: Tokens transferred successfully
        '400':
          description: Invalid request
        '500':
          description: Server error

  /token/batch-mint:
    post:
      summary: Batch mint multiple token IDs (requires MINTER_ROLE)
      tags:
        - Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
                - tokenIds
                - amounts
              properties:
                to:
                  type: string
                  description: Address to mint tokens to
                tokenIds:
                  type: array
                  items:
                    type: integer
                  description: Array of token IDs to mint
                amounts:
                  type: array
                  items:
                    type: string
                  description: Array of amounts to mint (must match tokenIds length)
      responses:
        '201':
          description: Tokens batch minted successfully
        '400':
          description: Invalid request
        '500':
          description: Server error

  /token/burn:
    post:
      summary: Burn CENT tokens (reduce supply)
      tags:
        - Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: string
                  description: Amount of CENT tokens to burn
      responses:
        '200':
          description: Tokens burned successfully
        '400':
          description: Invalid request
        '500':
          description: Server error

  /token/batch-burn:
    post:
      summary: Batch burn multiple token IDs
      tags:
        - Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tokenIds
                - amounts
              properties:
                tokenIds:
                  type: array
                  items:
                    type: integer
                  description: Array of token IDs to burn
                amounts:
                  type: array
                  items:
                    type: string
                  description: Array of amounts to burn (must match tokenIds length)
      responses:
        '200':
          description: Tokens batch burned successfully
        '400':
          description: Invalid request
        '500':
          description: Server error

  /token/set-max-supply:
    post:
      summary: Set maximum token supply (requires ADMIN_ROLE)
      tags:
        - Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - maxSupply
              properties:
                maxSupply:
                  type: string
                  description: Maximum supply cap in tokens
      responses:
        '200':
          description: Max supply set successfully
        '400':
          description: Invalid request
        '500':
          description: Server error

  /token/pause:
    post:
      summary: Pause token contract (requires PAUSER_ROLE)
      tags:
        - Token
      responses:
        '200':
          description: Contract paused successfully
        '500':
          description: Server error

  /token/unpause:
    post:
      summary: Unpause token contract (requires PAUSER_ROLE)
      tags:
        - Token
      responses:
        '200':
          description: Contract unpaused successfully
        '500':
          description: Server error

  /token/grant-role:
    post:
      summary: Grant a role to an address (requires ADMIN_ROLE)
      tags:
        - Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
                - account
              properties:
                role:
                  type: string
                  description: Role hash (e.g., MINTER_ROLE, ADMIN_ROLE)
                account:
                  type: string
                  description: Address to grant role to
      responses:
        '200':
          description: Role granted successfully
        '400':
          description: Invalid request
        '403':
          description: Access denied - missing ADMIN_ROLE
        '500':
          description: Server error

  /token/revoke-role:
    post:
      summary: Revoke a role from an address (requires ADMIN_ROLE)
      tags:
        - Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
                - account
              properties:
                role:
                  type: string
                  description: Role hash (e.g., MINTER_ROLE, ADMIN_ROLE)
                account:
                  type: string
                  description: Address to revoke role from
      responses:
        '200':
          description: Role revoked successfully
        '400':
          description: Invalid request
        '403':
          description: Access denied - missing ADMIN_ROLE
        '500':
          description: Server error

  /staking/stake:
    post:
      summary: Stake tokens
      tags:
        - Staking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: string
                  description: Amount to stake (in tokens)
      responses:
        '201':
          description: Tokens staked successfully
        '400':
          description: Invalid request
        '500':
          description: Server error

  /staking/cooldown:
    post:
      summary: Start cooldown period before unstaking
      tags:
        - Staking
      responses:
        '200':
          description: Cooldown started successfully
        '500':
          description: Server error

  /staking/unstake:
    post:
      summary: Unstake tokens
      tags:
        - Staking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: string
                  description: Amount to unstake (in tokens)
      responses:
        '200':
          description: Tokens unstaked successfully
        '400':
          description: Invalid request
        '500':
          description: Server error

  /staking/claim:
    post:
      summary: Claim staking rewards
      tags:
        - Staking
      responses:
        '200':
          description: Rewards claimed successfully
        '500':
          description: Server error

  /staking/info/{address}:
    get:
      summary: Get staking information for a user
      tags:
        - Staking
      parameters:
        - in: path
          name: address
          required: false
          schema:
            type: string
          description: User address (optional, defaults to wallet address)
      responses:
        '200':
          description: Staking info retrieved successfully
        '500':
          description: Server error

  /staking/contract-info:
    get:
      summary: Get staking contract information
      tags:
        - Staking
      responses:
        '200':
          description: Contract info retrieved successfully

  /staking/set-reward-duration:
    post:
      summary: Set reward duration (requires ADMIN_ROLE)
      tags:
        - Staking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - duration
              properties:
                duration:
                  type: integer
                  description: Reward duration in seconds
      responses:
        '200':
          description: Reward duration set successfully
        '400':
          description: Invalid request
        '403':
          description: Access denied - missing ADMIN_ROLE
        '500':
          description: Server error

  /staking/has-role/{role}/{address}:
    get:
      summary: Check if an address has a specific role
      tags:
        - Staking
      parameters:
        - in: path
          name: role
          required: true
          schema:
            type: string
          description: Role hash (e.g., OPERATOR_ROLE, REWARDS_DISTRIBUTOR_ROLE)
        - in: path
          name: address
          required: true
          schema:
            type: string
          description: Address to check
      responses:
        '200':
          description: Role check result
        '400':
          description: Invalid request
        '500':
          description: Server error

  /staking/grant-role:
    post:
      summary: Grant a role to an address (requires ADMIN_ROLE)
      tags:
        - Staking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
                - account
              properties:
                role:
                  type: string
                  description: Role hash (e.g., OPERATOR_ROLE, REWARDS_DISTRIBUTOR_ROLE)
                account:
                  type: string
                  description: Address to grant role to
      responses:
        '200':
          description: Role granted successfully
        '400':
          description: Invalid request
        '403':
          description: Access denied - missing ADMIN_ROLE
        '500':
          description: Server error

  /staking/revoke-role:
    post:
      summary: Revoke a role from an address (requires ADMIN_ROLE)
      tags:
        - Staking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
                - account
              properties:
                role:
                  type: string
                  description: Role hash (e.g., OPERATOR_ROLE, REWARDS_DISTRIBUTOR_ROLE)
                account:
                  type: string
                  description: Address to revoke role from
      responses:
        '200':
          description: Role revoked successfully
        '400':
          description: Invalid request
        '403':
          description: Access denied - missing ADMIN_ROLE
        '500':
          description: Server error

  /staking/notify-reward:
    post:
      summary: Notify reward amount and update reward rate (requires REWARDS_DISTRIBUTOR_ROLE)
      tags:
        - Staking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: string
                  description: Reward amount to deposit (in tokens)
      responses:
        '200':
          description: Reward notified successfully
        '400':
          description: Invalid request
        '500':
          description: Server error

  /persona/profile:
    post:
      summary: Create or update profile
      tags:
        - Persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Profile name
                bio:
                  type: string
                  description: Profile bio
                avatar:
                  type: string
                  description: Profile avatar URL
      responses:
        '201':
          description: Profile created/updated successfully
        '400':
          description: Invalid request
        '500':
          description: Server error

  /persona/profile/{address}:
    get:
      summary: Get profile for a user
      tags:
        - Persona
      parameters:
        - in: path
          name: address
          required: false
          schema:
            type: string
          description: User address (optional, defaults to wallet address)
      responses:
        '200':
          description: Profile retrieved successfully
        '500':
          description: Server error

  /persona/follow:
    post:
      summary: Follow a user
      tags:
        - Persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - following
              properties:
                following:
                  type: string
                  description: Address of user to follow
      responses:
        '200':
          description: User followed successfully
        '400':
          description: Invalid request
        '500':
          description: Server error

  /persona/unfollow:
    post:
      summary: Unfollow a user
      tags:
        - Persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - following
              properties:
                following:
                  type: string
                  description: Address of user to unfollow
      responses:
        '200':
          description: User unfollowed successfully
        '400':
          description: Invalid request
        '500':
          description: Server error

  /persona/verify-identity:
    post:
      summary: Verify user identity (requires VERIFIER_ROLE)
      tags:
        - Persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user
                - platform
                - platformId
                - signature
              properties:
                user:
                  type: string
                  description: User address
                platform:
                  type: string
                  description: Platform name (e.g., "github", "twitter")
                platformId:
                  type: string
                  description: Platform user ID
                signature:
                  type: string
                  description: Verification signature
      responses:
        '200':
          description: Identity verified successfully
        '400':
          description: Invalid request
        '500':
          description: Server error

  /persona/relationships/{address}:
    get:
      summary: Get relationships for a user
      tags:
        - Persona
      parameters:
        - in: path
          name: address
          required: false
          schema:
            type: string
          description: User address (optional, defaults to wallet address)
      responses:
        '200':
          description: Relationships retrieved successfully
        '500':
          description: Server error

  /persona/is-following/{follower}/{following}:
    get:
      summary: Check if user follows another user
      tags:
        - Persona
      parameters:
        - in: path
          name: follower
          required: true
          schema:
            type: string
          description: Follower address
        - in: path
          name: following
          required: true
          schema:
            type: string
          description: Following address
      responses:
        '200':
          description: Follow status retrieved successfully
        '400':
          description: Invalid request
        '500':
          description: Server error

  /persona/following/{address}:
    get:
      summary: Get list of addresses a user is following
      tags:
        - Persona
      parameters:
        - in: path
          name: address
          required: false
          schema:
            type: string
          description: User address (optional, defaults to wallet address)
      responses:
        '200':
          description: Following list retrieved successfully
        '500':
          description: Server error

