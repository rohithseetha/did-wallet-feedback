    get:
      summary: Get contract constants
      tags:
        - Persona
      responses:
        '200':
          description: Constants retrieved successfully
        '500':
          description: Server error

  /persona/has-role/{role}/{address}:
    get:
      summary: Check if an address has a specific role
      tags:
        - Persona
      parameters:
        - in: path
          name: role
          required: true
          schema:
            type: string
          description: Role hash (e.g., OPERATOR_ROLE, VERIFIER_ROLE)
        - in: path
          name: address
          required: true
          schema:
            type: string
          description: Address to check
      responses:
        '200':
          description: Role check result
        '400':
          description: Invalid request
        '500':
          description: Server error

  /persona/grant-role:
    post:
      summary: Grant a role to an address (requires ADMIN_ROLE)
      tags:
        - Persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
                - account
              properties:
                role:
                  type: string
                  description: Role hash (e.g., OPERATOR_ROLE, VERIFIER_ROLE)
                account:
                  type: string
                  description: Address to grant role to
      responses:
        '200':
          description: Role granted successfully
        '400':
          description: Invalid request
        '403':
          description: Access denied - missing ADMIN_ROLE
        '500':
          description: Server error

  /persona/revoke-role:
    post:
      summary: Revoke a role from an address (requires ADMIN_ROLE)
      tags:
        - Persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
                - account
